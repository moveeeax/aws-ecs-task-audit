[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ecs-task-audit"
version = "0.1.0"
description = "Static audit of ECS task definitions: plaintext secrets, mutable image tags, missing logging and health checks, root users, impossible Fargate sizes, and task roles that are really the execution role."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "ecs", "fargate", "audit", "security", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aws-ecs-task-audit = "aws_ecs_task_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-ecs-task-audit"
Source = "https://github.com/moveeeax/aws-ecs-task-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
