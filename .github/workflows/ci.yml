name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Audit the bundled example
        run: |
          set +e
          aws-ecs-task-audit --from-json examples/messy-dump.json --fail-on plaintext-secret
          code=$?
          set -e
          test "$code" -eq 1
          aws-ecs-task-audit --from-json examples/clean-dump.json
